hostname ri
password zebra
enable password zebra
!
! eth0: LAN LI (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EE_I hacia RE (costo RI -> RE = 35)
interface eth1
 ip ospf cost 35
 ip ospf area 0.0.0.0
!
! eth2: EC_I hacia RC (costo RI -> RC = 20)
interface eth2
 ip ospf cost 20
 ip ospf area 0.0.0.0
!
router ospf
!
