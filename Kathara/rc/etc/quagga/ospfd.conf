hostname rc
password zebra
enable password zebra
!
! eth0: LAN LC (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EC_D hacia RD (costo RC -> RD = 50)
interface eth1
 ip ospf cost 50
 ip ospf area 0.0.0.0
!
! eth2: EC_M hacia RM (costo RC -> RM = 60)
interface eth2
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
! eth3: EC_I hacia RI (costo RC -> RI = 60)
interface eth3
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
router ospf
 default-information originate
!
