hostname rt
password zebra
enable password zebra
!
! eth0: LAN LT (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: ES_T hacia RS (costo RT -> RS = 40)
interface eth1
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
! eth2: EL_T hacia RL (costo RT -> RL = 55)
interface eth2
 ip ospf cost 55
 ip ospf area 0.0.0.0
!
! eth3: ET_UV hacia RUV (costo RT -> RUV = 45)
interface eth3
 ip ospf cost 45
 ip ospf area 0.0.0.0
!
! eth4: EO_T hacia RO (costo RT -> RO = 25)
interface eth4
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
router ospf
!
