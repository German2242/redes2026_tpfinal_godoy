hostname rg
password zebra
enable password zebra
!
! eth0: LAN LG (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EG_S hacia RS (costo RG -> RS = 55)
interface eth1
 ip ospf cost 55
 ip ospf area 0.0.0.0
!
! eth2: EF_G hacia RF (costo RG -> RF = 40)
interface eth2
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
! eth3: EG_H hacia RH (costo RG -> RH = 30)
interface eth3
 ip ospf cost 30
 ip ospf area 0.0.0.0
!
! eth4: EG_K hacia RK (costo RG -> RK = 50)
interface eth4
 ip ospf cost 50
 ip ospf area 0.0.0.0
!
router ospf
!
