hostname ruv
password zebra
enable password zebra
!
! eth0: LAN LU (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: LAN LV (sin costo declarado: OSPF usa 10)
interface eth1
 ip ospf area 0.0.0.0
!
! eth2: ET_UV hacia RT (costo RUV -> RT = 60)
interface eth2
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
router ospf
!
