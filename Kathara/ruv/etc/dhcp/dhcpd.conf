# Servidor DHCP de RUV para la LAN LV (192.168.222.0/24) - Punto 7

# 7c: tiempo de asignación de 5 minutos (300 segundos)
default-lease-time 300;
max-lease-time 300;

ddns-update-style none;
authoritative;

# Opciones que reciben todos los hosts: DNS de la empresa (punto 4)
option domain-name "sinergia.izo";
option domain-name-servers 172.24.1.253;

subnet 192.168.222.0 netmask 255.255.255.0 {
    # 7b: rango de IP dinámicas (HV3, HV4 y HV5)
    range 192.168.222.100 192.168.222.200;
    option routers 192.168.222.254;
    option broadcast-address 192.168.222.255;
}

# 7b: IP fijas, reservadas por MAC (la MAC se fija en lab.conf)
host hv1 {
    hardware ethernet 02:00:00:00:00:01;
    fixed-address 192.168.222.253;
}

host hv2 {
    hardware ethernet 02:00:00:00:00:02;
    fixed-address 192.168.222.252;
}
