hostname rd
password zebra
enable password zebra
!
! eth0: LAN LD (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EC_D hacia RC (costo RD -> RC = 40)
interface eth1
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
! eth2: ED_N hacia RN (costo RD -> RN = 50)
interface eth2
 ip ospf cost 50
 ip ospf area 0.0.0.0
!
! eth3: ED_E hacia RE (costo RD -> RE = 50)
interface eth3
 ip ospf cost 50
 ip ospf area 0.0.0.0
!
router ospf
!
