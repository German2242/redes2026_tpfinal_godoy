hostname re
password zebra
enable password zebra
!
! eth0: LAN LE (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: ED_E hacia RD (costo RE -> RD = 55)
interface eth1
 ip ospf cost 55
 ip ospf area 0.0.0.0
!
! eth2: EE_I hacia RI (costo RE -> RI = 60)
interface eth2
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
! eth3: EE_J hacia RJ (costo RE -> RJ = 30)
interface eth3
 ip ospf cost 30
 ip ospf area 0.0.0.0
!
! eth4: EE_O hacia RO (costo RE -> RO = 45)
interface eth4
 ip ospf cost 45
 ip ospf area 0.0.0.0
!
! eth5: EE_R hacia RR (costo RE -> RR = 30)
interface eth5
 ip ospf cost 30
 ip ospf area 0.0.0.0
!
router ospf
!
