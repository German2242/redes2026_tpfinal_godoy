hostname rk
password zebra
enable password zebra
!
! eth0: LAN LK (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EK_M hacia RM (costo RK -> RM = 45)
interface eth1
 ip ospf cost 45
 ip ospf area 0.0.0.0
!
! eth2: EA_K hacia RA (costo RK -> RA = 30)
interface eth2
 ip ospf cost 30
 ip ospf area 0.0.0.0
!
! eth3: EK_PQ hacia RPQ (costo RK -> RPQ = 60)
interface eth3
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
! eth4: EB_K hacia RB (costo RK -> RB = 60)
interface eth4
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
! eth5: EG_K hacia RG (costo RK -> RG = 40)
interface eth5
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
router ospf
!
