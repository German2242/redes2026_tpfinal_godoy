hostname rs
password zebra
enable password zebra
!
! eth0: LAN LS (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EN_S hacia RN (costo RS -> RN = 40)
interface eth1
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
! eth2: EG_S hacia RG (costo RS -> RG = 35)
interface eth2
 ip ospf cost 35
 ip ospf area 0.0.0.0
!
! eth3: ES_T hacia RT (costo RS -> RT = 25)
interface eth3
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
router ospf
!
