hostname rm
password zebra
enable password zebra
!
! eth0: LAN LM (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EM_N hacia RN (costo RM -> RN = 60)
interface eth1
 ip ospf cost 60
 ip ospf area 0.0.0.0
!
! eth2: EC_M hacia RC (costo RM -> RC = 25)
interface eth2
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
! eth3: EK_M hacia RK (costo RM -> RK = 25)
interface eth3
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
router ospf
!
