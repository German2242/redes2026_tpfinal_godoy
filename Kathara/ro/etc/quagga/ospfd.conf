hostname ro
password zebra
enable password zebra
!
! eth0: LAN LO (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: EE_O hacia RE (costo RO -> RE = 30)
interface eth1
 ip ospf cost 30
 ip ospf area 0.0.0.0
!
! eth2: EO_T hacia RT (costo RO -> RT = 50)
interface eth2
 ip ospf cost 50
 ip ospf area 0.0.0.0
!
router ospf
!
