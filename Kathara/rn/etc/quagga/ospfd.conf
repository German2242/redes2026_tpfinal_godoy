hostname rn
password zebra
enable password zebra
!
! eth0: LAN LN (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: ED_N hacia RD (costo RN -> RD = 25)
interface eth1
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
! eth2: EM_N hacia RM (costo RN -> RM = 20)
interface eth2
 ip ospf cost 20
 ip ospf area 0.0.0.0
!
! eth3: EN_S hacia RS (costo RN -> RS = 55)
interface eth3
 ip ospf cost 55
 ip ospf area 0.0.0.0
!
router ospf
!
