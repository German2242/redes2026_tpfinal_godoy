# Punto 8: sitio de Sinergia
ServerName www.sinergia.izo

# Cada dirección ejecuta un script CGI (la raíz muestra el login)
ScriptAliasMatch ^/$ /usr/lib/cgi-bin/login.py
ScriptAlias /login  /usr/lib/cgi-bin/login.py
ScriptAlias /main   /usr/lib/cgi-bin/main.py
ScriptAlias /logout /usr/lib/cgi-bin/main.py
