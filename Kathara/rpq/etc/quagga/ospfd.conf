hostname rpq
password zebra
enable password zebra
!
! eth0: LAN LP (sin costo declarado: OSPF usa 10)
interface eth0
 ip ospf area 0.0.0.0
!
! eth1: LAN LQ (sin costo declarado: OSPF usa 10)
interface eth1
 ip ospf area 0.0.0.0
!
! eth2: EK_PQ hacia RK (costo RPQ -> RK = 25)
interface eth2
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
router ospf
!
